<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00a77b">
<title>NATA Group Polska</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f6;
  color:#17211e;
}
header{
  background:#00a77b;
  color:white;
  padding:18px;
}
.wrap{max-width:760px;margin:auto}
.brand{font-size:22px;font-weight:800}
.lang{display:flex;gap:8px;margin-top:12px}
.lang button{
  border:1px solid #ffffff88;
  background:#ffffff22;
  color:white;
  padding:7px 12px;
  border-radius:9px;
  cursor:pointer;
}
main{
  max-width:760px;
  margin:auto;
  padding:15px 15px 110px;
}
.hero,.card,.sheet{
  background:white;
  border-radius:17px;
}
.hero{
  padding:18px;
  margin-bottom:15px;
}
.hero h1{margin:0 0 8px}
.hero p{margin:0;color:#68746f}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.card{
  padding:14px;
  box-shadow:0 3px 14px #0000000d;
}
.icon{font-size:34px}
.card h3{font-size:15px;min-height:36px}
select,input,textarea{
  width:100%;
  padding:11px;
  border:1px solid #dce3e0;
  border-radius:10px;
  margin-top:8px;
  font-size:15px;
}
.add,.send{
  width:100%;
  border:0;
  border-radius:10px;
  padding:12px;
  background:#00a77b;
  color:white;
  font-weight:700;
  margin-top:9px;
  cursor:pointer;
}
.bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #ddd;
  padding:10px;
  z-index:10;
}
.barin{
  max-width:760px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
}
.barinfo{flex:1}
.checkout{
  border:0;
  border-radius:10px;
  background:#18342c;
  color:white;
  padding:12px 15px;
  font-weight:700;
  cursor:pointer;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50;
  padding:15px;
  overflow:auto;
}
.modal.on{display:block}
.sheet{
  max-width:560px;
  margin:20px auto;
  padding:18px;
}
.item{
  padding:10px 0;
  border-bottom:1px solid #eee;
}
.row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:7px;
}
.qty{
  width:34px;
  height:34px;
  border:0;
  border-radius:8px;
  font-size:20px;
  cursor:pointer;
}
.del{
  margin-left:auto;
  border:0;
  padding:8px;
  border-radius:8px;
  color:#a00;
  cursor:pointer;
}
.close{
  width:100%;
  border:0;
  padding:11px;
  border-radius:10px;
  margin-top:8px;
  cursor:pointer;
}
.status{
  padding:10px;
  margin-top:10px;
  border-radius:9px;
  display:none;
}
.ok{
  display:block;
  background:#e8f8f2;
  color:#08795a;
}
.err{
  display:block;
  background:#fff0f0;
  color:#b42318;
}
</style>
</head>

<body>

<header>
<div class="wrap">
  <div class="brand">NATA GROUP Polska 🇵🇱</div>
  <div id="sub"></div>

  <div class="lang">
    <button type="button" onclick="setLang('pl')">PL</button>
    <button type="button" onclick="setLang('uk')">UA</button>
    <button type="button" onclick="setLang('ru')">RU</button>
  </div>
</div>
</header>

<main>

<section class="hero">
  <h1>NATA Clean</h1>
  <p id="desc"></p>
</section>

<div class="grid" id="products"></div>

</main>

<div class="bar">
<div class="barin">

  <div class="barinfo">
    <b id="cartLabel"></b><br>
    <span id="count"></span>
  </div>

  <button
    type="button"
    class="checkout"
    id="openCart">
  </button>

</div>
</div>

<div class="modal" id="modal">

<div class="sheet">

  <h2 id="orderTitle"></h2>

  <div id="items"></div>

  <input id="name" type="text">
  <input id="phone" type="tel">
  <input id="city" type="text">
  <textarea id="comment"></textarea>

  <button
    type="button"
    class="send"
    id="send">
  </button>

  <button
    type="button"
    class="close"
    id="close">
  </button>

  <div class="status" id="status"></div>

</div>
</div>

<script>
const API =
"https://nata-group-polska-orders.bapeakk15.workers.dev";

const T = {

pl:{
 sub:"Profesjonalne środki czystości",
 desc:"Profesjonalna chemia gospodarcza dla domu i biznesu. Dostawa w Warszawie i całej Polsce.",
 cart:"Koszyk",
 products:"produktów",
 add:"Dodaj",
 checkout:"Złóż zamówienie",
 order:"Twoje zamówienie",
 empty:"Koszyk jest pusty",
 remove:"Usuń",
 name:"Imię i nazwisko",
 phone:"Telefon",
 city:"Miasto",
 comment:"Adres / komentarz",
 send:"Wyślij zamówienie",
 sending:"Wysyłanie...",
 close:"Wróć do sklepu",
 required:"Wpisz imię i numer telefonu.",
 success:"Zamówienie wysłane. Menedżer skontaktuje się z Tobą.",
 error:"Błąd wysyłania zamówienia."
},

uk:{
 sub:"Професійні засоби для прибирання",
 desc:"Професійна побутова хімія для дому та бізнесу. Доставка у Варшаві та по всій Польщі.",
 cart:"Кошик",
 products:"товарів",
 add:"Додати",
 checkout:"Оформити замовлення",
 order:"Ваше замовлення",
 empty:"Кошик порожній",
 remove:"Видалити",
 name:"Ім'я та прізвище",
 phone:"Телефон",
 city:"Місто",
 comment:"Адреса / коментар",
 send:"Надіслати замовлення",
 sending:"Надсилання...",
 close:"Повернутися до магазину",
 required:"Вкажіть ім'я та номер телефону.",
 success:"Замовлення надіслано. Менеджер зв'яжеться з вами.",
 error:"Помилка надсилання замовлення."
},

ru:{
 sub:"Профессиональные средства для уборки",
 desc:"Профессиональная бытовая химия для дома и бизнеса. Доставка по Варшаве и всей Польше.",
 cart:"Корзина",
 products:"товаров",
 add:"Добавить",
 checkout:"Оформить заказ",
 order:"Ваш заказ",
 empty:"Корзина пуста",
 remove:"Удалить",
 name:"Имя и фамилия",
 phone:"Телефон",
 city:"Город",
 comment:"Адрес / комментарий",
 send:"Отправить заказ",
 sending:"Отправляем...",
 close:"Вернуться в магазин",
 required:"Укажите имя и номер телефона.",
 success:"Заказ отправлен. Менеджер свяжется с вами.",
 error:"Ошибка отправки заказа."
}

};

const P = [

{
 id:"glass",
 icon:"photo_2026-09-28_10-17-37.jpg",
 image:"photo_2026-09-28_10-17-37.jpg",
 pl:"Płyn do szyb i luster",
 uk:"Засіб для скла та дзеркал",
 ru:"Средство для стекла и зеркал"
},

{
 id:"bath",
 icon:"🚿",
 image:"ванная.jpg",
 pl:"Środek do łazienki",
 uk:"Засіб для ванної кімнати",
 ru:"Средство для ванной"
},

{
 id:"pipes",
 icon:"🚰",
 image:"труба.jpg",
 pl:"Środek do rur i kanalizacji",
 uk:"Засіб для труб і каналізації",
 ru:"Средство для труб и канализации"
},

{
 id:"grease",
 icon:"🍳",
 image:"труба.jpg",
 pl:"Antytłuszcz",
 uk:"Антижир",
 ru:"Антижир"
}

];

let lang =
localStorage.getItem("nata_language") || "pl";

let cart = [];

try{
 cart =
 JSON.parse(
   localStorage.getItem("nata_cart") || "[]"
 );
}catch(e){
 cart = [];
}

function el(id){
 return document.getElementById(id);
}

function saveCart(){
 localStorage.setItem(
   "nata_cart",
   JSON.stringify(cart)
 );
 updateCounter();
}

function setLang(newLang){
 lang = newLang;

 localStorage.setItem(
   "nata_language",
   lang
 );

 render();
}

function render(){

 const t = T[lang];

 el("sub").textContent = t.sub;
 el("desc").textContent = t.desc;
 el("cartLabel").textContent = t.cart;
 el("openCart").textContent = t.checkout;
 el("orderTitle").textContent = t.order;

 el("name").placeholder = t.name;
 el("phone").placeholder = t.phone;
 el("city").placeholder = t.city;
 el("comment").placeholder = t.comment;

 el("send").textContent = t.send;
 el("close").textContent = t.close;

 el("products").innerHTML =
 P.map(function(product){

   return `
   <div class="card">

     <div class="icon">
 ${product.image ? `<img src="${product.image}" style="width:100%;height:180px;object-fit:contain;">` : product.icon}
</div>

     <h3>
       ${product[lang]}
     </h3>

     <select id="volume-${product.id}">
       <option value="0,5 L">0,5 L</option>
       <option value="1 L">1 L</option>
       <option value="5 L">5 L</option>
     </select>

     <button
       type="button"
       class="add"
       onclick="addProduct('${product.id}')">
       ${t.add}
     </button>

   </div>
   `;

 }).join("");

 updateCounter();
}

function addProduct(id){

 const volume =
 el("volume-" + id).value;

 const existing =
 cart.find(function(item){
   return item.id === id &&
          item.volume === volume;
 });

 if(existing){
   existing.quantity++;
 }else{
   cart.push({
     id:id,
     volume:volume,
     quantity:1
   });
 }

 saveCart();
}

function updateCounter(){

 const number =
 cart.reduce(function(total,item){
   return total + item.quantity;
 },0);

 el("count").textContent =
 number + " " + T[lang].products;
}

function openCart(){

 el("modal").classList.add("on");

 drawCart();
}

function closeCart(){

 el("modal").classList.remove("on");

 el("status").className = "status";
 el("status").textContent = "";
}

function drawCart(){

 const t = T[lang];

 if(cart.length === 0){

   el("items").innerHTML =
   "<p>" + t.empty + "</p>";

   return;
 }

 el("items").innerHTML =
 cart.map(function(item,index){

   const product =
   P.find(function(p){
     return p.id === item.id;
   });

   return `
   <div class="item">

     <b>${product[lang]}</b>
     <div>${item.volume}</div>

     <div class="row">

       <button
         type="button"
         class="qty"
         onclick="changeQty(${index},-1)">
         −
       </button>

       <b>${item.quantity}</b>

       <button
         type="button"
         class="qty"
         onclick="changeQty(${index},1)">
         +
       </button>

       <button
         type="button"
         class="del"
         onclick="removeItem(${index})">
         ${t.remove}
       </button>

     </div>

   </div>
   `;

 }).join("");
}

function changeQty(index,change){

 cart[index].quantity += change;

 if(cart[index].quantity <= 0){
   cart.splice(index,1);
 }

 saveCart();
 drawCart();
}

function removeItem(index){

 cart.splice(index,1);

 saveCart();
 drawCart();
}

function showStatus(type,text){

 el("status").className =
 "status " + type;

 el("status").textContent = text;
}

async function submitOrder(){

 const t = T[lang];

 if(cart.length === 0){

   showStatus(
     "err",
     t.empty
   );

   return;
 }

 const name =
 el("name").value.trim();

 const phone =
 el("phone").value.trim();

 if(!name || !phone){

   showStatus(
     "err",
     t.required
   );

   return;
 }

 const button = el("send");

 button.disabled = true;
 button.textContent = t.sending;

 const orderItems =
 cart.map(function(item){

   const product =
   P.find(function(p){
     return p.id === item.id;
   });

   return {
     name:
       product[lang] +
       " (" +
       item.volume +
       ")",
     quantity:item.quantity
   };

 });

 let telegramUser = null;

 try{

   telegramUser =
   Telegram.WebApp
   .initDataUnsafe
   .user || null;

 }catch(e){}

 const order = {

   customer:{
     name:name,
     phone:phone,
     city:el("city").value.trim(),
     comment:el("comment").value.trim()
   },

   items:orderItems,

   language:lang,

   source:"Telegram Mini App",

   telegram_user:telegramUser

 };

 try{

   const response =
   await fetch(
     API + "/order",
     {
       method:"POST",

       headers:{
         "Content-Type":
         "application/json"
       },

       body:
       JSON.stringify(order)
     }
   );

   const result =
   await response.json();

   if(!response.ok || !result.ok){

     throw new Error(
       result.error ||
       "Order error"
     );
   }

   cart = [];

   saveCart();
   drawCart();

   showStatus(
     "ok",
     t.success
   );

 }catch(error){

   console.error(error);

   showStatus(
     "err",
     t.error
   );

 }finally{

   button.disabled = false;

   button.textContent =
   t.send;
 }
}

el("openCart").addEventListener(
 "click",
 openCart
);

el("close").addEventListener(
 "click",
 closeCart
);

el("send").addEventListener(
 "click",
 submitOrder
);

if(
 window.Telegram &&
 Telegram.WebApp
){

 Telegram.WebApp.ready();
 Telegram.WebApp.expand();
}

render();

</script>

</body>
</html>
