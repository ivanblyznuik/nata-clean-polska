<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NATA Group Polska</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#f5f7f6;color:#17202a}header{background:#00a77b;color:#fff;padding:18px}.brand{font-size:22px;font-weight:800}.langs{display:flex;gap:8px;margin-top:10px}.langs button,.add,.send,.checkout{border:0;border-radius:10px;padding:10px;font-weight:700}.langs button{background:#fff2;color:#fff;border:1px solid #fff8}main{padding:14px 14px 110px;max-width:700px;margin:auto}.hero,.card,.sheet{background:#fff;border-radius:17px;padding:16px;box-shadow:0 3px 14px #0001}.hero{margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.icon{font-size:32px}.card h3{font-size:15px}.add,.send{background:#00a77b;color:#fff;width:100%;margin-top:10px}.cartbar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 14px;border-top:1px solid #ddd}.cartin{max-width:700px;margin:auto;display:flex;gap:10px;align-items:center}.cartinfo{flex:1}.checkout{background:#183029;color:#fff}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:16px;overflow:auto}.modal.show{display:block}.sheet{max-width:540px;margin:25px auto}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px}.status{margin-top:10px}</style></head><body><header><div class="brand">NATA GROUP Polska 🇵🇱</div><div class="langs"><button onclick="L('pl')">PL</button><button onclick="L('uk')">UA</button><button onclick="L('ru')">RU</button></div></header><main><div class="hero"><h1>NATA Clean</h1><p id="intro"></p></div><div class="grid" id="products"></div></main><div class="cartbar"><div class="cartin"><div class="cartinfo"><b id="cartTitle"></b><br><span id="sum"></span></div><button class="checkout" id="checkout" onclick="openCart()"></button></div></div><div class="modal" id="modal"><div class="sheet"><h2 id="orderTitle"></h2><div id="lines"></div><input id="name"><input id="phone"><input id="city"><textarea id="comment"></textarea><button class="send" id="send" onclick="sendOrder()"></button><button class="send" style="background:#68736e" onclick="modal.classList.remove('show')">×</button><div id="status" class="status"></div></div></div><script>
const API='https://nata-group-polska-orders.bapeakk15.workers.dev';
const P=[['glass','🪟','Płyn do szyb i luster','Засіб для скла та дзеркал','Средство для стекла и зеркал'],['bath','🚿','Środek do łazienki','Засіб для ванної кімнати','Средство для ванной'],['pipes','🚰','Środek do rur i kanalizacji','Засіб для труб і каналізації','Средство для труб и канализации'],['grease','🍳','Antytłuszcz','Антижир','Антижир']];
const T={pl:['Profesjonalna chemia gospodarcza dla domu i biznesu. Dostawa w Warszawie i całej Polsce.','Koszyk','produktów','Dodaj','Złóż zamówienie','Twoje zamówienie','Wyślij zamówienie','Imię i nazwisko','Telefon','Miasto','Adres / komentarz','Koszyk jest pusty','Zamówienie wysłane. Menedżer skontaktuje się z Tobą.','Wpisz imię i telefon.','Błąd wysyłania.'],uk:['Професійна побутова хімія для дому та бізнесу. Доставка у Варшаві та по всій Польщі.','Кошик','товарів','Додати','Оформити замовлення','Ваше замовлення','Надіслати замовлення',"Ім'я та прізвище",'Телефон','Місто','Адреса / коментар','Кошик порожній',"Замовлення надіслано. Менеджер зв'яжеться з вами.",'Вкажіть ім’я та телефон.','Помилка надсилання.'],ru:['Профессиональная бытовая химия для дома и бизнеса. Доставка по Варшаве и всей Польше.','Корзина','товаров','Добавить','Оформить заказ','Ваш заказ','Отправить заказ','Имя и фамилия','Телефон','Город','Адрес / комментарий','Корзина пуста','Заказ отправлен. Менеджер свяжется с вами.','Укажите имя и телефон.','Ошибка отправки.']};
let lang=localStorage.lang||'pl',cart=JSON.parse(localStorage.cart||'{}');const pn=p=>p[lang==='pl'?2:lang==='uk'?3:4];function L(x){lang=x;localStorage.lang=x;render()}function render(){let x=T[lang];intro.textContent=x[0];cartTitle.textContent=x[1];checkout.textContent=x[4];orderTitle.textContent=x[5];send.textContent=x[6];name.placeholder=x[7];phone.placeholder=x[8];city.placeholder=x[9];comment.placeholder=x[10];products.innerHTML=P.map(p=>`<div class="card"><div class="icon">${p[1]}</div><h3>${pn(p)}</h3><small>0,5 L / 1 L / 5 L</small><button class="add" onclick="add('${p[0]}')">${x[3]}</button></div>`).join('');summary()}function add(id){cart[id]=(cart[id]||0)+1;localStorage.cart=JSON.stringify(cart);summary()}function summary(){sum.textContent=Object.values(cart).reduce((a,b)=>a+b,0)+' '+T[lang][2]}function openCart(){modal.classList.add('show');let e=Object.entries(cart);lines.innerHTML=e.length?e.map(([id,q])=>`<div class="row"><span>${pn(P.find(p=>p[0]===id))}</span><b>${q}×</b></div>`).join(''):`<p>${T[lang][11]}</p>`}async function sendOrder(){let e=Object.entries(cart),x=T[lang];if(!e.length){status.textContent=x[11];return}if(!name.value.trim()||!phone.value.trim()){status.textContent=x[13];return}let body={customer:{name:name.value.trim(),phone:phone.value.trim(),city:city.value.trim(),comment:comment.value.trim()},items:e.map(([id,quantity])=>({name:pn(P.find(p=>p[0]===id)),quantity})),language:lang,source:'Telegram Mini App',telegram_user:window.Telegram?.WebApp?.initDataUnsafe?.user||null};send.disabled=true;status.textContent='...';try{let r=await fetch(API+'/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw 0;status.textContent=x[12];cart={};localStorage.cart='{}';summary()}catch(e){status.textContent=x[14]}finally{send.disabled=false}}if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}render();
</script></body></html>
