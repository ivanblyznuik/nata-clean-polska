<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00a77b">
<title>NATA Group Polska</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f6;
  color:#17211e;
}

header{
  background:#00a77b;
  color:white;
  padding:18px 16px;
}

.brand{
  font-size:23px;
  font-weight:800;
}

.subtitle{
  margin-top:4px;
  opacity:.9;
}

.languages{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.languages button{
  border:1px solid rgba(255,255,255,.6);
  background:rgba(255,255,255,.15);
  color:white;
  padding:7px 13px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

main{
  max-width:760px;
  margin:auto;
  padding:15px 15px 110px;
}

.hero{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.hero h1{
  margin:0 0 8px;
}

.hero p{
  margin:0;
  color:#68746f;
  line-height:1.45;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product{
  background:white;
  padding:15px;
  border-radius:17px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.product-icon{
  font-size:36px;
}

.product h3{
  font-size:16px;
  margin:9px 0;
}

.volume{
  width:100%;
  padding:9px;
  border:1px solid #dfe6e3;
  border-radius:9px;
  background:white;
  margin-bottom:8px;
}

.add{
  width:100%;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#00a77b;
  color:white;
  font-weight:800;
  cursor:pointer;
}

.cart-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #e0e5e3;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  z-index:10;
}

.cart-inner{
  max-width:760px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.cart-info{
  flex:1;
}

.cart-info span{
  color:#6d7873;
  font-size:13px;
}

.checkout{
  border:0;
  border-radius:11px;
  background:#18342c;
  color:white;
  padding:12px 16px;
  font-weight:800;
  cursor:pointer;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  padding:16px;
  overflow:auto;
}

.modal.active{
  display:block;
}

.sheet{
  max-width:570px;
  margin:20px auto;
  background:white;
  border-radius:20px;
  padding:18px;
}

.sheet h2{
  margin-top:0;
}

.cart-item{
  border-bottom:1px solid #edf0ef;
  padding:12px 0;
}

.item-name{
  font-weight:700;
}

.item-volume{
  color:#74807b;
  font-size:13px;
  margin-top:3px;
}

.item-controls{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.qty{
  width:34px;
  height:34px;
  border:0;
  border-radius:8px;
  background:#edf5f2;
  font-size:20px;
  cursor:pointer;
}

.remove{
  margin-left:auto;
  border:0;
  background:#fff0f0;
  color:#b42318;
  border-radius:8px;
  padding:8px 10px;
  cursor:pointer;
}

input,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #dce3e0;
  border-radius:11px;
  margin-top:8px;
  font-size:16px;
}

textarea{
  min-height:75px;
  resize:vertical;
}

.send-order{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:#00a77b;
  color:white;
  font-size:16px;
  font-weight:800;
  margin-top:12px;
  cursor:pointer;
}

.send-order:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.close{
  width:100%;
  border:0;
  padding:11px;
  border-radius:11px;
  margin-top:8px;
  background:#e9eeec;
  cursor:pointer;
}

.status{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  display:none;
}

.status.success{
  display:block;
  background:#e8f8f2;
  color:#08795a;
}

.status.error{
  display:block;
  background:#fff0f0;
  color:#b42318;
}

.empty{
  text-align:center;
  color:#77827e;
  padding:20px;
}

@media(max-width:420px){
  .products{
    grid-template-columns:1fr 1fr;
  }

  .product{
    padding:12px;
  }

  .product h3{
    font-size:14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">NATA GROUP Polska 🇵🇱</div>
  <div class="subtitle" id="subtitle"></div>

  <div class="languages">
    <button type="button" onclick="changeLanguage('pl')">PL</button>
    <button type="button" onclick="changeLanguage('uk')">UA</button>
    <button type="button" onclick="changeLanguage('ru')">RU</button>
  </div>
</header>

<main>

<section class="hero">
  <h1>NATA Clean</h1>
  <p id="description"></p>
</section>

<div class="products" id="products"></div>

</main>

<div class="cart-bar">
  <div class="cart-inner">

    <div class="cart-info">
      <b id="cartText"></b><br>
      <span id="cartCount">0</span>
    </div>

    <button
      type="button"
      class="checkout"
      id="checkoutButton">
    </button>

  </div>
</div>


<div class="modal" id="cartModal">

  <div class="sheet">

    <h2 id="orderTitle"></h2>

    <div id="cartItems"></div>

    <input
      type="text"
      id="customerName"
      autocomplete="name">

    <input
      type="tel"
      id="customerPhone"
      autocomplete="tel">

    <input
      type="text"
      id="customerCity">

    <textarea id="customerComment"></textarea>

    <button
      type="button"
      class="send-order"
      id="sendOrderButton">
    </button>

    <button
      type="button"
      class="close"
      id="closeButton">
    </button>

    <div id="status" class="status"></div>

  </div>

</div>


<script>
"use strict";

const API =
  "https://nata-group-polska-orders.bapeakk15.workers.dev";

const translations = {

  pl:{
    subtitle:"Profesjonalne środki czystości",
    description:
      "Profesjonalna chemia gospodarcza dla domu i biznesu. Dostawa w Warszawie i na terenie całej Polski.",
    cart:"Koszyk",
    products:"produktów",
    add:"Dodaj",
    checkout:"Złóż zamówienie",
    order:"Twoje zamówienie",
    empty:"Koszyk jest pusty",
    remove:"Usuń",
    name:"Imię i nazwisko",
    phone:"Telefon",
    city:"Miasto",
    comment:"Adres / komentarz",
    send:"Wyślij zamówienie",
    sending:"Wysyłanie...",
    close:"Wróć do sklepu",
    required:"Wpisz imię i numer telefonu.",
    success:
      "Zamówienie zostało wysłane. Menedżer skontaktuje się z Tobą.",
    error:
      "Nie udało się wysłać zamówienia. Spróbuj ponownie."
  },

  uk:{
    subtitle:"Професійні засоби для прибирання",
    description:
      "Професійна побутова хімія для дому та бізнесу. Доставка у Варшаві та по всій Польщі.",
    cart:"Кошик",
    products:"товарів",
    add:"Додати",
    checkout:"Оформити замовлення",
    order:"Ваше замовлення",
    empty:"Кошик порожній",
    remove:"Видалити",
    name:"Ім'я та прізвище",
    phone:"Телефон",
    city:"Місто",
    comment:"Адреса / коментар",
    send:"Надіслати замовлення",
    sending:"Надсилання...",
    close:"Повернутися до магазину",
    required:"Вкажіть ім'я та номер телефону.",
    success:
      "Замовлення надіслано. Менеджер зв'яжеться з вами.",
    error:
      "Не вдалося надіслати замовлення. Спробуйте ще раз."
  },

  ru:{
    subtitle:"Профессиональные средства для уборки",
    description:
      "Профессиональная бытовая химия для дома и бизнеса. Доставка по Варшаве и всей Польше.",
    cart:"Корзина",
    products:"товаров",
    add:"Добавить",
    checkout:"Оформить заказ",
    order:"Ваш заказ",
    empty:"Корзина пуста",
    remove:"Удалить",
    name:"Имя и фамилия",
    phone:"Телефон",
    city:"Город",
    comment:"Адрес / комментарий",
    send:"Отправить заказ",
    sending:"Отправляем...",
    close:"Вернуться в магазин",
    required:"Укажите имя и номер телефона.",
    success:
      "Заказ отправлен. Менеджер свяжется с вами.",
    error:
      "Не удалось отправить заказ. Попробуйте ещё раз."
  }
};


const products = [

  {
    id:"glass",
    icon:"🪟",
    pl:"Płyn do szyb i luster",
    uk:"Засіб для скла та дзеркал",
    ru:"Средство для стекла и зеркал"
  },

  {
    id:"bath",
    icon:"🚿",
    pl:"Środek do łazienki",
    uk:"Засіб для ванної кімнати",
    ru:"Средство для ванной"
  },

  {
    id:"pipes",
    icon:"🚰",
    pl:"Środek do rur i kanalizacji",
    uk:"Засіб для труб і каналізації",
    ru:"Средство для труб и канализации"
  },

  {
    id:"grease",
    icon:"🍳",
    pl:"Antytłuszcz",
    uk:"Антижир",
    ru:"Антижир"
  }

];


let language =
  localStorage.getItem("nata_language") || "pl";

let cart = [];

try{
  cart =
    JSON.parse(localStorage.getItem("nata_cart")) || [];
}catch(e){
  cart = [];
}


function productName(product){
  return product[language];
}


function saveCart(){
  localStorage.setItem(
    "nata_cart",
    JSON.stringify(cart)
  );

  updateCartCounter();
}


function changeLanguage(newLanguage){

  language = newLanguage;

  localStorage.setItem(
    "nata_language",
    language
  );

  render();
}


function render(){

  const t = translations[language];

  document.documentElement.lang = language;

  document.getElementById("subtitle").textContent =
    t.subtitle;

  document.getElementById("description").textContent =
    t.description;

  document.getElementById("cartText").textContent =
    t.cart;

  document.getElementById("checkoutButton").textContent =
    t.checkout;

  document.getElementById("orderTitle").textContent =
    t.order;

  document.getElementById("customerName").placeholder =
    t.name;

  document.getElementById("customerPhone").placeholder =
    t.phone;

  document.getElementById("customerCity").placeholder =
    t.city;

  document.getElementById("customerComment").placeholder =
    t.comment;

  document.getElementById("sendOrderButton").textContent =
    t.send;

  document.getElementById("closeButton").textContent =
    t.close;


  document.getElementById("products").innerHTML =
    products.map(product => {

      return `
        <div class="product">

          <div class="product-icon">
            ${product.icon}
          </div>

          <h3>
            ${productName(product)}
          </h3>

          <select
            class="volume"
            id="volume-${product.id}">

            <option value="0,5 L">
              0,5 L
            </option>

            <option value="1 L">
              1 L
            </option>

            <option value="5 L">
              5 L
            </option>

          </select>

          <button
            type="button"
            class="add"
            onclick="addToCart('${product.id}')">

            ${t.add}

          </button>

        </div>
      `;

    }).join("");


  updateCartCounter();

  if(
    document
      .getElementById("cartModal")
      .classList.contains("active")
  ){
    renderCart();
  }
}


function addToCart(productId){

  const volume =
    document.getElementById(
      "volume-" + productId
    ).value;

  const existing =
    cart.find(item =>
      item.id === productId &&
      item.volume === volume
    );


  if(existing){

    existing.quantity += 1;

  }else{

    cart.push({
      id:productId,
      volume:volume,
      quantity:1
    });

  }


  saveCart();


  if(
    window.Telegram &&
    Telegram.WebApp &&
    Telegram.WebApp.HapticFeedback
  ){
    Telegram.WebApp.HapticFeedback
      .impactOccurred("light");
  }
}


function updateCartCounter(){

  const count =
    cart.reduce(
      (sum,item) =>
        sum + item.quantity,
      0
    );

  document.getElementById(
    "cartCount"
  ).textContent =
    count +
    " " +
    translations[language].products;
}


function openCart(){

  document
    .getElementById("cartModal")
    .classList.add("active");

  renderCart();
}


function closeCart(){

  document
    .getElementById("cartModal")
    .classList.remove("active");

  clearStatus();
}


function renderCart(){

  const container =
    document.getElementById("cartItems");

  const t =
    translations[language];


  if(cart.length === 0){

    container.innerHTML =
      `<div class="empty">${t.empty}</div>`;

    return;
  }


  container.innerHTML =
    cart.map((item,index) => {

      const product =
        products.find(
          p => p.id === item.id
        );

      return `
        <div class="cart-item">

          <div class="item-name">
            ${productName(product)}
          </div>

          <div class="item-volume">
            ${item.volume}
          </div>

          <div class="item-controls">

            <button
              type="button"
              class="qty"
              onclick="changeQuantity(${index},-1)">
              −
            </button>

            <b>
              ${item.quantity}
            </b>

            <button
              type="button"
              class="qty"
              onclick="changeQuantity(${index},1)">
              +
            </button>

            <button
              type="button"
              class="remove"
              onclick="removeItem(${index})">
              ${t.remove}
            </button>

          </div>

        </div>
      `;

    }).join("");
}


function changeQuantity(index,change){

  if(!cart[index]){
    return;
  }

  cart[index].quantity += change;

  if(cart[index].quantity <= 0){
    cart.splice(index,1);
  }

  saveCart();

  renderCart();
}


function removeItem(index){

  cart.splice(index,1);

  saveCart();

  renderCart();
}


function clearStatus(){

  const status =
    document.getElementById("status");

  status.className = "status";

  status.textContent = "";
}


function showStatus(type,text){

  const status =
    document.getElementById("status");

  status.className =
    "status " + type;

  status.textContent = text;
}


async function submitOrder(){

  const t =
    translations[language];

  clearStatus();


  if(cart.length === 0){

    showStatus(
      "error",
      t.empty
    );

    return;
  }


  const name =
    document
      .getElementById("customerName")
      .value
      .trim();

  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();

  const city =
    document
      .getElementById("customerCity")
      .value
      .trim();

  const comment =
    document
      .getElementById("customerComment")
      .value
      .trim();


  if(!name || !phone){

    showStatus(
      "error",
      t.required
    );

    return;
  }


  const button =
    document.getElementById(
      "sendOrderButton"
    );


  const originalText =
    button.textContent;


  button.disabled = true;

  button.textContent =
    t.sending;


  const items =
    cart.map(item => {

      const product =
        products.find(
          p => p.id === item.id
        );

      return {
        id:item.id,
        name:
          productName(product) +
          " (" +
          item.volume +
          ")",
        volume:item.volume,
        quantity:item.quantity
      };

    });


  let telegramUser = null;


  try{

    if(
      window.Telegram &&
      Telegram.WebApp &&
      Telegram.WebApp.initDataUnsafe
    ){
      telegramUser =
        Telegram.WebApp
          .initDataUnsafe
          .user || null;
    }

  }catch(e){}


  const order = {

    customer:{
      name:name,
      phone:phone,
      city:city,
      comment:comment
    },

    items:items,

    language:language,

    source:"Telegram Mini App",

    telegram_user:telegramUser

  };


  try{

    const response =
      await fetch(
        API + "/order",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(order)
        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.ok
    ){

      throw new Error(
        result.error ||
        "Order error"
      );

    }


    showStatus(
      "success",
      t.success
    );


    cart = [];

    saveCart();

    renderCart();


    document
      .getElementById("customerComment")
      .value = "";


    if(
      window.Telegram &&
      Telegram.WebApp &&
      Telegram.WebApp.HapticFeedback
    ){

      Telegram.WebApp
        .HapticFeedback
        .notificationOccurred(
          "success"
        );
    }


  }catch(error){

    console.error(error);

    showStatus(
      "error",
      t.error
    );

  }finally{

    button.disabled = false;

    button.textContent =
      originalText;

  }
}


document
  .getElementById("checkoutButton")
  .addEventListener(
    "click",
    openCart
  );


document
  .getElementById("closeButton")
  .addEventListener(
    "click",
    closeCart
  );


document
  .getElementById("sendOrderButton")
  .addEventListener(
    "click",
    submitOrder
  );


document
  .getElementById("cartModal")
  .addEventListener(
    "click",
    function(event){

      if(
        event.target ===
        document.getElementById(
          "cartModal"
        )
      ){
        closeCart();
      }

    }
  );


if(
  window.Telegram &&
  Telegram.WebApp
){

  Telegram.WebApp.ready();

  Telegram.WebApp.expand();
